<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Atharav Narang</title>
  <desc id="desc">Software engineering and applied AI. An original dark editorial banner with subtle animated geometry.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#111820"/>
      <stop offset=".55" stop-color="#10151b"/>
      <stop offset="1" stop-color="#152522"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="0">
      <stop stop-color="#b9d5c5"/>
      <stop offset="1" stop-color="#7ca892"/>
    </linearGradient>
    <linearGradient id="fade" x2="1" y2="0">
      <stop stop-color="#9cb7a8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#9cb7a8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d9e4dc" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
