    <rect width="1200" height="340" fill="url(#grid)"/>
    <path d="M55 60H1145M55 280H1145" stroke="#d7e5da" stroke-opacity=".12"/>
    <path d="M55 60H145" stroke="url(#accent)" stroke-width="2"/>
    <text x="56" y="92" fill="#a1baa9" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.5">ATHARAV / 001</text>
    <text x="56" y="179" fill="#f1f3ee" font-family="Arial, Helvetica, sans-serif" font-size="63" font-weight="600" letter-spacing="-3">Atharav Narang</text>
    <text x="58" y="222" fill="#b8c7bc" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing=".4">Software engineering  /  Applied AI</text>
    <text x="56" y="306" fill="#8d9e93" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2.6">BUILDING SYSTEMS THAT HOLD UP IN THE REAL WORLD</text>
    <circle cx="1000" cy="170" r="116" fill="none" stroke="#a5c6ae" stroke-opacity=".14"/>
    <circle cx="1000" cy="170" r="87" fill="none" stroke="#a5c6ae" stroke-opacity=".22"/>
    <circle cx="1000" cy="170" r="59" fill="none" stroke="#b3d4bc" stroke-opacity=".28"/>
    <path d="M884 170H1116M1000 54V286" stroke="#b7d0bd" stroke-opacity=".12"/>
    <g id="radar-rotor" transform="rotate(0 1000 170)">
