    <path d="M734 280H1138" stroke="url(#fade)"/>
    <text x="1144" y="305" fill="#8d9e93" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2">BENGALURU  ·  INDIA</text>
