      <path d="M1000 54A116 116 0 0 1 1082 88" fill="none" stroke="#a7d7ae" stroke-width="2" stroke-linecap="round"/>
      <path d="M1000 170L1000 55" stroke="#b4d8b9" stroke-width="1.5" stroke-opacity=".65"/>
      <circle cx="1000" cy="54" r="3" fill="#d2e7d5"/>
